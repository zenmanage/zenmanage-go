name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        path: [ ., middleware/gin, middleware/echo ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: ${{ matrix.path }}

  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: root
            path: .
            threshold: 80
          - name: middleware-gin
            path: middleware/gin
            threshold: 85
          - name: middleware-echo
            path: middleware/echo
            threshold: 85

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.12'

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code -- go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test $(go list ./... | grep -v /examples) -race -coverprofile=coverage.out

      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage for ${{ matrix.name }}: ${total}%"
          awk -v total="$total" -v threshold="${{ matrix.threshold }}" \
            'BEGIN { exit (total + 0 < threshold + 0) }' \
            || { echo "Coverage ${total}% is below the ${{ matrix.threshold }}% threshold"; exit 1; }

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.path }}/coverage.out
